name: omni_network_flutter_example
description: "Shows the OmniNetwork inspector over a small app."
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  omni_network: ^0.1.1
  omni_network_flutter:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_lints: ^6.0.0

# omni_network_flutter depends on the hosted omni_network; use the local copy.
dependency_overrides:
  omni_network:
    path: ../../omni_network
