name: omni_route
description: "Fast, zero-lag routing, transitions, and Bloc scoping for Flutter."
version: 0.4.0
repository: https://github.com/juwelzan/omni_route
homepage: https://github.com/juwelzan/omni_route
issue_tracker: https://github.com/juwelzan/omni_route/issues
publish_to: none # remove before first release (see doc/release.md)

topics:
  - navigation
  - routing
  - bloc
  - go-router

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

workspace:
  - packages/omni_network
  - packages/omni_network_flutter
  - packages/omni_network_ws
  - packages/omni_network_openapi

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.18.0
  flutter_bloc: ^9.1.1
  logger: ^2.8.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: ^3.0.10

